[project]
name = "chirayu"
version = "0.1.0"
description = "A pricing, risk and financing desk for GPU operating leases, with tamper-evident condition data."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "pynacl>=1.5",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.4"]
stats = ["lifelines>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "witness*", "attacks*", "ledger*", "eval*", "wear*", "market*", "risk*", "data*"]
